name: PORTAL-LAB
on:
  push:
    paths: ['PORTAL-LAB/**','contracts/**','.github/workflows/portal.yml']
  pull_request:
    paths: ['PORTAL-LAB/**','contracts/**','.github/workflows/portal.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PORTAL-LAB
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: PORTAL-LAB/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
