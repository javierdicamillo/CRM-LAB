services:
  app:
    image: crm-lab:0.1.0
    env_file: ./secrets/app.env
    restart: unless-stopped
    init: true
    networks: [default,database]
    volumes:
      - ./uploads:/data/uploads
    mem_limit: 768m
    cpus: 0.75
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: [CMD,node,-e,"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  worker:
    image: crm-lab:0.1.0
    command: [node,dist/worker.mjs]
    env_file: ./secrets/app.env
    restart: unless-stopped
    init: true
    networks: [default,database]
    volumes:
      - ./uploads:/data/uploads:ro
    mem_limit: 256m
    cpus: 0.4
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy
